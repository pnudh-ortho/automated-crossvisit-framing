# =============================================================================
# 교정과 사진 자동화 웹앱 설정
# 파일명/폴더명 형식이 바뀌어도 코드 수정 없이 이 파일만 고치면 되도록 설계.
# =============================================================================

# ── 저장 경로 ────────────────────────────────────────────────────────────────
paths:
  # 환자 폴더들이 생성되는 루트. Windows 예: "D:/교정과_환자자료"
  #
  # **기본값은 저장소 밖**이다 (`~` = Windows 의 %USERPROFILE%). 프로그램 폴더 안에
  # 두면 업데이트(`git pull`)가 환자 폴더와 같은 트리를 건드리고, .gitignore 실수
  # 하나로 환자 정보가 저장소에 들어간다. Setup 화면에서 언제든 바꿀 수 있다.
  # **비워두면 프로그램 폴더 옆**에 만든다 (`<프로그램>_data`). 첫 실행 화면에서
  # 사용자가 확인·변경하고, 고른 값은 `settings.json` 에 남는다.
  # 여기에 절대경로를 적으면 그게 기본값이 된다 (예: "D:/교정과_환자자료").
  root: ""
  # 십자뷰 템플릿 pptx (재진 시에도 이 원본에서 깨끗한 슬라이드를 임포트)
  template_pptx: "../templates/intraoral_template.pptx"
  # 케이스 프레젠테이션 양식. 초진 PPT를 이걸 바탕으로 만든다. 없으면 종전처럼
  # 십자뷰 한 장짜리 PPT를 만든다(case_deck.enabled 참고).
  case_template_pptx: "../templates/case_template.pptx"
  # 가중치 폴더. **저장소에 없다** — 사용자가 `models/` 에 받은 파일을 넣으면
  # `weightstore` 가 검증해서 여기로 옮긴다. 바이너리를 git 에 넣으면 이력에
  # 영구히 쌓여 되돌릴 수 없다 (모델 하나가 15~291MB).
  models_dir: "../models/_installed"
  # 이력 로그 파일 (JSONL). 환자 루트와 같은 곳에 둔다 — 기록물이라 함께 백업된다.
  log_file: ""      # 비우면 환자 루트 아래 _audit_log.jsonl

# ── 명명 규칙 (템플릿 문자열) ─────────────────────────────────────────────────
naming:
  # 환자 폴더명
  folder_pattern: "{name}_{hospital_id}_{ortho_id}"
  # PPT 파일명 (초진 생성 시 사용 / 재진 시 파싱 대상)
  ppt_pattern: "{name}_{hospital_id}_{ortho_id}.pptx"
  # 사진 파일명.  visit=차수 알파벳(A,B,...), index=슬롯 순번(1~)
  photo_pattern: "{ortho_id}_{visit} ({index}).jpg"
  # 같은 자리의 추가 촬영본. 대표 사진 이름 뒤에 -2, -3...  n은 2부터.
  # 탐색기에서 대표 사진 바로 뒤에 붙어 정렬된다.
  photo_extra_pattern: "{ortho_id}_{visit} ({index})-{n}.jpg"
  # 차수 알파벳을 폴더에서 스캔하는 정규식 (캡처그룹 1 = 알파벳)
  visit_regex: "{ortho_id}_([A-Z]+)"

# ── 식별자 검증 ──────────────────────────────────────────────────────────────
identifiers:
  hospital_id: { digits: 9 }   # 병원 환자번호 9자리 숫자
  ortho_id:    { digits: 5 }   # 교정과 환자번호 5자리 숫자
  # 이름: 한글·영문 혼용 1~40자. 공백·마침표·하이픈·어퍼스트로피를 가운데에만 허용.
  # 숫자와 '_'는 금지 — 폴더명이 "{name}_{hospital_id}_{ortho_id}"라 파싱이 흔들린다.
  # 앞뒤 공백/마침표도 금지 (Windows 폴더명 규칙).
  name:        { allow_regex: "^[가-힣A-Za-z](?:[가-힣A-Za-z .'\\-]{0,38}[가-힣A-Za-z])?$" }

# ── 분류 클래스 (순서 = 학습/ONNX 출력 인덱스와 일치해야 함) ──────────────────
classes:
  - FACE         # 얼굴(정면·측면 구분 없음)
  - IO_FRONT     # 구내 정면
  - IO_RIGHT     # 구내 우측방
  - IO_LEFT      # 구내 좌측방
  - IO_UPPER     # 상악 교합면
  - IO_LOWER     # 하악 교합면
  - OTHERS       # 위 어디에도 해당하지 않는 사진 (슬롯·얼굴 어디에도 자동 배정하지 않음)

# 구내 클래스 → PPT 슬롯 → 파일명 순번(index) 매핑
#   (1)=IO_FRONT (2)=IO_RIGHT (3)=IO_LEFT (4)=IO_UPPER (5)=IO_LOWER
#
# SLOT_* 이름은 템플릿에서의 '자리'(슬라이드 위치)지 환자의 좌우가 아니다.
# 치과 관례대로 환자를 마주본 것처럼 배치한다 — 환자의 우측방이 보는 사람 왼쪽:
#   SLOT_LEFT (슬라이드 왼쪽)   ← IO_RIGHT (구내 우측방)
#   SLOT_RIGHT(슬라이드 오른쪽) ← IO_LEFT  (구내 좌측방)
# 파일명 순번은 자리가 아니라 클래스에 붙으므로 (2)=우측방, (3)=좌측방 그대로다.
intraoral_slots:
  IO_FRONT: { slot: SLOT_FRONT, index: 1 }
  IO_RIGHT: { slot: SLOT_LEFT,  index: 2 }
  IO_LEFT:  { slot: SLOT_RIGHT, index: 3 }
  IO_UPPER: { slot: SLOT_UPPER, index: 4 }
  IO_LOWER: { slot: SLOT_LOWER, index: 5 }

# 상하반전(vertical flip) 표시 슬롯 — 교합면은 거울로 찍어서 사용자는 뒤집힌
# 상태로 본다. 업로드 원본 파일과 PPT 에 박히는 이미지 자체는 손대지 않는다.
# 검수 화면과 PPT(a:xfrm/@flipV)가 각자 뒤집어 보여주고, 편집기 조작값은
# 뒤집힌 화면 기준으로 저장된다(coords.flip_editor_v 주석 참고).
# 분류·프레이밍 모델은 반전 없는 원본으로 학습됐으므로 추론은 항상 원본으로 한다.
flip_v_slots: [SLOT_UPPER, SLOT_LOWER]

# 얼굴 사진: 파일 저장만, PPT 미삽입(v1). 업로드/검수 순서대로 (6)부터 부여.
face:
  classes: [FACE]
  start_index: 6
  order: [FACE]   # 세부클래스를 구분하지 않으므로 단일 항목

# ── 임계값 ───────────────────────────────────────────────────────────────────
thresholds:
  classify_confidence: 0.70   # softmax 확률 미만이면 검수화면 경고
  # 정합 채택 판정
  registration:
    # 치아 중심점 경로의 문턱 (registration_teeth.py)
    teeth_min_inliers: 4            # 짝지어진 치아 최소 개수
    teeth_min_inlier_ratio: 0.45    # fit_robust 절사 후 남은 비율
    teeth_max_resid_spacing: 0.25   # 평균 잔차 / 치아 간격 (무차원)
  # 자동 프레이밍(초진 crop 예측) 채택 판정. 미달이면 cover-fit으로 물러나고
  # 검수화면에 '수동' 배지가 붙는다 — 예측이 사라지는 게 아니라 사람에게 넘어간다.
  framing:
    # 앙상블(fold 여러 개)일 때 모델 간 꼭짓점 불일치 상한(crop 폭 대비 %).
    # 교차검증 실측 오차가 클래스별 3~6%라 그보다 크게 갈리면 믿을 수 없다는 뜻.
    # 배포본 1개만 쓰면 잴 수 없으므로(nan) 이 조건은 자동 통과한다.
    max_spread_pct: 3.0
    # 상식 검사 — 사람이 절대 안 하는 크롭을 걸러낸다.
    min_crop_frac: 0.15       # raw 폭의 15% 미만 = 6.7배 확대
    max_crop_frac: 1.60       # 원본 밖으로 60% 넘게 나감
    max_angle_deg: 20.0       # 편집기 회전 슬라이더(±10°)의 2배

# ── 슬라이드/편집기 기하 ─────────────────────────────────────────────────────
geometry:
  emu_per_cm: 360000
  emu_per_inch: 914400
  # 검수 편집기에서 창(슬롯)을 렌더링하는 배율. 8.4cm × 100 = 840px
  render_px_per_cm: 100
  # PPT 에 넣을 그림을 구울 때의 해상도(px/cm). 창에 보이는 만큼만 잘라 넣으므로
  # 원본을 통째로 넣던 때처럼 이웃 슬롯을 침범하지 않는다(backend/crop.py).
  # 200 px/cm = 508 ppi — 1920px 프로젝터(76 px/cm)에는 넉넉하고, PPT 안에서
  # 확대해 봐도 충분하다. 원본 화소의 1/11 수준이라 파일도 가벼워진다.
  export_px_per_cm: 200
  # 회전 슬라이더 범위(도)
  rotation_range_deg: 10.0
  rotation_step_deg: 0.1
  # ── 레터박스: 사진이 창을 다 덮지 못할 때 드러나는 빈 공간 ──
  # 상하좌우에 여백이 없는 사진을 회전하면 귀퉁이가 비는데, 그 색.
  # 검수 편집기 캔버스(frontend/app.js)와 정합 기준영상 복원(ppt_reader)이
  # 이미 검정을 쓰므로, 검정이라야 화면과 PPT가 일치한다(WYSIWYG).
  letterbox_color: "000000"   # RGB hex ('#' 없이). 흰 여백을 원하면 "FFFFFF"
  # false로 두면 빈 공간이 생기지 않도록 배율 하한을 강제한다(회전 시 확대됨).
  # true면 사람이 손으로 자른 것과 같은 구도를 그대로 재현할 수 있다.
  allow_letterbox: true

# ── PPT 도형 이름 규약 (템플릿과 일치) ───────────────────────────────────────
ppt:
  slot_names: [SLOT_UPPER, SLOT_LEFT, SLOT_FRONT, SLOT_RIGHT, SLOT_LOWER]
  info_box_name: INFO_BOX
  mask_prefix: MASK_
  # INFO_BOX / 노트 ① 날짜 칸의 텍스트 형식.
  # 양식의 표기 그대로: "24.08.12 (초진 A)" · "24.09.26 (재진 B)"
  info_first_visit: "{date} (초진 {visit})"
  info_revisit: "{date} (재진 {visit})"
  info_date_format: "%y.%m.%d"    # YY.MM.DD (마침표는 안 붙인다)

# ── 케이스 덱 (초진) ─────────────────────────────────────────────────────────
# 초진 PPT를 케이스 프레젠테이션 양식(paths.case_template_pptx)으로 만든다.
# 좌표는 여기 적지 않는다 — 양식에 놓인 도형의 기하를 읽어 앵커로 쓴다.
case_deck:
  enabled: true
  # 양식에서 그대로 가져올 앞쪽 슬라이드 수 (1~16: 환자정보·Cc.Dx·Tx·안모·구내 개별)
  keep_slides: 16
  # 십자뷰의 바탕이 될 '빈 노트 슬라이드' 번호. 이 뒤(타 환자 진료기록)는 버린다.
  note_slide_no: 30
  # 얼굴 사진 자리가 있는 슬라이드 (4·5·6은 좌/우, 7·8·9는 중앙)
  face_slides: [4, 5, 6, 7, 8, 9]
  # 슬라이드 4 좌측 사진을 다시 쓰는, 위아래로 큰 자리
  big_slides: [10, 11]
  # 각 슬라이드가 무엇을 담는 자리인지. 화면 안내용이며 PPT에는 적히지 않는다.
  # 비워 두면 "슬라이드 N"으로만 보인다.
  slide_labels:
    4: "정면뷰"
    5: "45도뷰"
    6: "측면뷰"
    10: "분석"
    11: "분석"
  # 자동분류에서 세운 순서(1번째부터) → 얼굴 자리.
  # 사용자가 촬영순으로 정렬하면 그 순서가 곧 촬영 루틴이고, 루틴은 자리와
  # 1:1 로 대응한다. n번째 사진이 여기 n번째 자리로 들어간다.
  # 슬라이드 10·11(분석)은 4L 을 그대로 따라가므로 여기 적지 않는다.
  face_auto_order: ["4L", "4R", "7C", "5L", "5R", "6L", "6R", "8C", "9C"]
  # 검수 판에 '양식의 검은 띠'를 그려 줄 슬라이드. 사진 아래쪽이 띠에 가리는
  # 슬라이드만 적는다 — 얼굴을 그만큼 위로 올려 잡아야 한다는 걸 보이기 위한 것.
  mask_slides: [4, 5, 6]
  # 구내 사진을 한 장씩 크게 싣는 슬라이드.
  # **자리 이름이 아니라 촬영 순서로 짝짓는다.** 위 intraoral_slots 의 순번이
  # (1)정면 (2)우측방 (3)좌측방 (4)상악 (5)하악 이고, 슬라이드도 그 순서다.
  # SLOT_* 은 슬라이드에서의 자리지 환자의 좌우가 아니므로(우측방 → SLOT_LEFT),
  # 이름의 right/left 를 그대로 맞추면 13·14 가 뒤집힌다 — 실제로 뒤집혀 있었다.
  intraoral_slides:
    SLOT_FRONT: 12      # (1) 정면
    SLOT_LEFT:  13      # (2) 구내 우측방
    SLOT_RIGHT: 14      # (3) 구내 좌측방
    SLOT_UPPER: 15      # (4) 상악 교합면
    SLOT_LOWER: 16      # (5) 하악 교합면

# ── 차수 노트 (십자뷰 슬라이드의 텍스트 박스) ────────────────────────────────
# 사용자는 칸을 채우고, 서버가 아래 서식으로 합쳐 박스에 적는다.
# 값이 빈 칸만 들어간 줄은 통째로 빠진다 — "U: " 같은 빈 껍데기를 남기지 않는다.
notes:
  fields:
    # ── 첫 슬라이드(환자정보)로 가는 칸 ──────────────────────────────────────
    # 이름·병원번호·교정과번호는 환자를 고를 때 이미 받았으므로 묻지 않는다.
    # 여기 없는 값(성별·나이·C/C)만 받아서 양식의 머리말 뒤에 채운다.
    - {key: sex,        label: "성별",        hint: "M / F",        group: patient}
    - {key: age,        label: "나이",        hint: "24y 3m",       group: patient}
    - {key: cc,         label: "C/C",         hint: "주소(chief complaint)",
       lines: 2, group: patient}
    # ── 이번 차수의 노트 ─────────────────────────────────────────────────────
    - {key: wire_u,     label: "상악 와이어", hint: "018 NT /c loose cinch"}
    - {key: wire_l,     label: "하악 와이어", hint: "016 NT /c loose cinch"}
    # default 에는 자동 계산값을 끼울 수 있다: {first_date} {today} {months}
    # {visit} {visit_label}. 빈 칸에만 채워지고, 사람이 고치면 그쪽이 이긴다.
    # 치료·장치 시작은 초진보다 늦을 수 있다. "이 차수부터 시작" 을 체크하면 그
    # 차수 날짜가 괄호에 박히고, 이후 차수는 거기서부터 센다. 체크 전에는 0 month.
    - {key: tx_period,  label: "Tx. Period",  hint: "0 month",
       default: "{months_tx} month{tx_paren}"}
    - {key: rx_period,  label: "Rx. Period",  hint: "0 month (24.08.12)",
       default: "{months} month ({first_date})"}
    - {key: app_period, label: "App. Period", hint: "0 month",
       default: "{months_app} month{app_paren}"}
    - {key: subj,       label: "s) 주관적",   hint: "n/s",            lines: 3}
    - {key: plan,       label: "p) 처치",     hint: "AWC",            lines: 4}
    - {key: next,       label: "n) 다음",     hint: "AWC, ATE 고려",  lines: 4}
    # ④ 좌하단은 양식에 없던 자리다 — 무엇을 적을지 정해지면 서식을 손보면 된다.
    - {key: ll,         label: "좌하단 메모",  hint: "자유 기재",       lines: 4}
  # 줄 끝 괄호(Rx. Period 뒤의 초진 날짜 등)는 작게 쓴다 — 양식이 그렇게 돼 있다.
  date_pt: 9
  # 단, 날짜 칸의 "(초진 A)" 는 날짜가 아니라 차수 표시다 — 본문과 같은 크기로 둔다.
  date_pt_except: [NOTE_DATE]
  # 박스별 서식. {필드}가 비면 그 줄은 사라진다.
  boxes:
    # Tx. 위에 빈 줄 3개 — 양식이 그 높이에서 글을 시작한다. 와이어를 안 채우면
    # U:/L: 줄이 사라지면서 양식 원본과 똑같이 '빈 줄 3개 + Tx.' 가 된다.
    NOTE_STATUS: "U: {wire_u}\nL: {wire_l}\n\n\n\nTx. Period: {tx_period}\nRx. Period: {rx_period}\nApp. Period: {app_period}"
    NOTE_SOAP:   "s) {subj}\np) {plan}"
    NOTE_LL:     "{ll}"
    NOTE_NEXT:   "n) {next}"

# ── 첫 슬라이드(환자정보) 자동 입력 ──────────────────────────────────────────
# 양식 1번 슬라이드의 "Hospital No. / Case No. / Pt. name : / C/C :" 줄을 채운다.
# 줄을 통째로 갈아끼우지 않고 **머리말 뒤만** 채운다 — 양식의 글꼴·줄간격이
# 그대로 남는다. 머리말은 양식에 적힌 글자 그대로 적어야 찾을 수 있다.
# 쓰이는 칸이 모두 비면 그 줄은 손대지 않는다(양식의 안내 문구를 지우지 않는다).
patient_info:
  enabled: true
  slide_no: 1
  lines:
    "Hospital No.": " {hospital_id}"
    "Case No.":     " {ortho_id}"
    "Pt. name :":   " {name} ({sex}/{age})"
    "C/C :":        " {cc}"
