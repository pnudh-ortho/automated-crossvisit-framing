# =============================================================================
# CRoCs Fastest Lap 설정
#
# 본편과 달리 PPT 를 읽지도 쓰지도 않는다 — 자동분류 → (재진이면 정합) → 검수 →
# **이미지 저장**이 전부다. 사용자 취향(저장 경로·파일명·반전 기본값 등)은
# settings.json 에 있고, 이 파일은 코드와 짝을 이루는 값만 담는다.
# =============================================================================

# ── 저장 경로 ────────────────────────────────────────────────────────────────
paths:
  # 저장 루트 기본값. 비워두면 프로그램 폴더 옆(<프로그램>_data)이고, 사용자가
  # 고른 값은 settings.json 의 root 가 이긴다.
  root: ""
  # 가중치 폴더. **저장소에 없다** — 사용자가 `models/` 에 받은 파일을 넣으면
  # `weightstore` 가 검증해서 여기로 옮긴다.
  models_dir: "../models/_installed"
  # 이력 로그 파일 (JSONL). 비우면 저장 루트 아래 _audit_log.jsonl
  log_file: ""

# ── 분류 클래스 (순서 = 학습/ONNX 출력 인덱스와 일치해야 함) ──────────────────
classes:
  - FACE         # 얼굴(정면·측면 구분 없음)
  - IO_FRONT     # 구내 정면
  - IO_RIGHT     # 구내 우측방
  - IO_LEFT      # 구내 좌측방
  - IO_UPPER     # 상악 교합면
  - IO_LOWER     # 하악 교합면
  - OTHERS       # 위 어디에도 해당하지 않는 사진 (자동 배정하지 않음)

# 구내 클래스 → 십자뷰 슬롯 → 저장 순번 매핑. SLOT_* 은 화면에서의 '자리'지
# 환자의 좌우가 아니다 — 치과 관례대로 환자를 마주본 것처럼 배치한다.
intraoral_slots:
  IO_FRONT: { slot: SLOT_FRONT, index: 1 }
  IO_RIGHT: { slot: SLOT_LEFT,  index: 2 }
  IO_LEFT:  { slot: SLOT_RIGHT, index: 3 }
  IO_UPPER: { slot: SLOT_UPPER, index: 4 }
  IO_LOWER: { slot: SLOT_LOWER, index: 5 }

slot_names: [SLOT_UPPER, SLOT_LEFT, SLOT_FRONT, SLOT_RIGHT, SLOT_LOWER]

# 십자뷰 슬롯 창 (cm). 본편에서는 템플릿 PPT 의 도형 기하에서 읽었지만, PPT 를
# 버리면서 그 값을 여기 박아 둔다 — intraoral_template.pptx 의 실측값 그대로다.
# 이 값이 바뀌면 본편 결과물과 프레임이 어긋나므로 함부로 고치지 않는다.
slot_windows:
  SLOT_UPPER: { x: 8.5,   y: 0.025,  w: 8.4, h: 6.3 }
  SLOT_LEFT:  { x: 0.05,  y: 6.375,  w: 8.4, h: 6.3 }
  SLOT_FRONT: { x: 8.5,   y: 6.375,  w: 8.4, h: 6.3 }
  SLOT_RIGHT: { x: 16.95, y: 6.375,  w: 8.4, h: 6.3 }
  SLOT_LOWER: { x: 8.5,   y: 12.725, w: 8.4, h: 6.3 }

# 얼굴 검수 창 (cm). '사진 한 장짜리 슬라이드' 하나에 쓰이므로 x·y 는 의미가
# 없고 비율·크기만 쓴다. 3:4 세로 — 프레이밍 FACE 모델의 crop 비율과 같다.
face_window: { x: 0.0, y: 0.0, w: 8.4, h: 11.2 }

# 얼굴 사진: 저장 시 촬영 순서대로 번호가 붙는다.
face:
  classes: [FACE]
  start_index: 1
  order: [FACE]

# ── 임계값 ───────────────────────────────────────────────────────────────────
thresholds:
  classify_confidence: 0.70   # softmax 확률 미만이면 검수화면 경고
  registration:
    teeth_min_inliers: 4            # 짝지어진 치아 최소 개수
    teeth_min_inlier_ratio: 0.45    # fit_robust 절사 후 남은 비율
    teeth_max_resid_spacing: 0.25   # 평균 잔차 / 치아 간격 (무차원)
  framing:
    max_spread_pct: 3.0
    min_crop_frac: 0.15       # raw 폭의 15% 미만 = 6.7배 확대
    max_crop_frac: 1.60       # 원본 밖으로 60% 넘게 나감
    max_angle_deg: 20.0       # 편집기 회전 슬라이더(±10°)의 2배

# ── 편집기/출력 기하 ─────────────────────────────────────────────────────────
geometry:
  emu_per_cm: 360000
  emu_per_inch: 914400
  # 검수 편집기에서 창(슬롯)을 렌더링하는 배율. 8.4cm × 100 = 840px
  render_px_per_cm: 100
  # 저장 이미지 해상도(px/cm) 기본값. settings.json 의 output.px_per_cm 이 이긴다.
  export_px_per_cm: 200
  rotation_range_deg: 10.0
  rotation_step_deg: 0.1
  letterbox_color: "000000"   # 회전·축소로 드러나는 빈 자리 색 (RGB hex)
  allow_letterbox: true

# ── 성능 ─────────────────────────────────────────────────────────────────────
perf:
  # 슬롯별 정합/프레이밍을 몇 개까지 동시에 돌릴까. 0 = 자동(min(3, cpu//2)).
  # ONNX 세션 자체가 코어를 여럿 쓰므로 너무 키우면 서로 밟는다 — 실측 후 조정.
  pair_workers: 0
